name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --no-frozen-lockfile

      # - run: pnpm typecheck

      # - run: pnpm test

      - run: pnpm build --filter create-better-openclaw

      - run: pnpm build --filter @better-openclaw/mcp


      # - name: Publish Core to npm
      #   run: pnpm publish --filter @better-openclaw/core --no-git-checks --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP to npm
        run: pnpm publish --filter @better-openclaw/mcp --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npm
        run: pnpm publish --filter create-better-openclaw --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
